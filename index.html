<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablero Kanban</title>
    <!-- Vinculamos el archivo de estilos vacío por ahora -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- CABECERA PRINCIPAL -->
    <header class="app-header">
        <h1 class="logo">Mi Kanban</h1>
        
        <!-- Panel de estadísticas rápidas -->
        <div class="stats-panel" id="stats-panel">
            <span>Por Hacer: <b id="count-todo">0</b></span> |
            <span>En Proceso: <b id="count-doing">0</b></span> |
            <span>Finalizado: <b id="count-done">0</b></span>
        </div>

        <!-- Buscador -->
        <div class="search-bar">
            <input type="text" id="search-input" placeholder="Buscar tarea...">
        </div>
    </header>

    <!-- TABLERO KANBAN (Contenedor de las columnas) -->
    <main class="board-container">
        
        <!-- COLUMNA 1: POR HACER -->
        <section class="column" data-status="todo">
            <header class="column-header">
                <h2>Por Hacer</h2>
                <!-- El botón para abrir el modal de crear tarea -->
                <button id="btn-create-task" class="btn-primary">+ Nueva Tarea</button>
            </header>
            <!-- Aquí es donde JavaScript inyectará las tarjetas -->
            <div class="task-list" id="todo-list"></div>
        </section>

        <!-- COLUMNA 2: EN PROCESO -->
        <section class="column" data-status="doing">
            <header class="column-header">
                <h2>En Proceso</h2>
            </header>
            <div class="task-list" id="doing-list"></div>
        </section>

        <!-- COLUMNA 3: FINALIZADO -->
        <section class="column" data-status="done">
            <header class="column-header">
                <h2>Finalizado</h2>
            </header>
            <div class="task-list" id="done-list"></div>
        </section>

    </main>

    <!-- MODAL PARA CREAR TAREA -->
    <dialog id="modal-create-task" class="modal">
        <form id="form-create-task">
            <h3>Crear Nueva Tarea</h3>
            
            <label for="task-title">Título:</label>
            <input type="text" id="task-title" required placeholder="Ej: Diseñar logo">
            
            <label for="task-desc">Descripción:</label>
            <textarea id="task-desc" required placeholder="Detalles de la tarea..."></textarea>
            
            <label for="task-priority">Prioridad:</label>
            <select id="task-priority">
                <option value="Alta">Alta</option>
                <option value="Media">Media</option>
                <option value="Baja">Baja</option>
            </select>

            <label for="task-date">Fecha límite:</label>
            <input type="date" id="task-date">
            
            <div class="modal-actions">
                <button type="button" id="btn-cancel-task" class="btn-secondary">Cancelar</button>
                <button type="submit" class="btn-primary">Guardar</button>
            </div>
        </form>
    </dialog>

    <!-- MODAL PARA EDITAR TAREA -->
    <dialog id="modal-edit-task" class="modal">
        <form id="form-edit-task">
            <h3>Editar Tarea</h3>
            
            <!-- Guardamos el ID oculto para saber qué tarea actualizar -->
            <input type="hidden" id="edit-task-id">
            
            <label for="edit-task-title">Título:</label>
            <input type="text" id="edit-task-title" required>
            
            <label for="edit-task-desc">Descripción:</label>
            <textarea id="edit-task-desc" required></textarea>
            
            <label for="edit-task-priority">Prioridad:</label>
            <select id="edit-task-priority">
                <option value="Alta">Alta</option>
                <option value="Media">Media</option>
                <option value="Baja">Baja</option>
            </select>

            <label for="edit-task-date">Fecha límite:</label>
            <input type="date" id="edit-task-date">
            
            <div class="modal-actions">
                <button type="button" id="btn-cancel-edit" class="btn-secondary">Cancelar</button>
                <button type="submit" class="btn-primary">Actualizar</button>
            </div>
        </form>
    </dialog>
    
    <!-- Librería externa para el Drag & Drop -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    
    <!-- Tu archivo de JavaScript debe ir siempre DEBAJO -->
    <script src="main.js"></script>
</body>
</html>
