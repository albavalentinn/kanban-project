<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GetOrganized</title>
    <link rel="icon" type="image/svg+xml" href="logo.svg" />
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
  </head>
  <body>
    <!-- 0. PANTALLA DE LOGIN / REGISTRO -->
    <section id="auth-container" class="auth-container">
      <article class="auth-card">
        <h1
          class="logo"
          style="text-align: center; margin-bottom: 2rem; color: #0052cc"
        >
          GetOrganized
        </h1>
        <h2 id="auth-title">Iniciar Sesión</h2>

        <form id="auth-form">
          <label for="auth-username">Usuario:</label>
          <input
            type="text"
            id="auth-username"
            required
            placeholder="Tu nombre de usuario"
          />

          <label for="auth-password">Contraseña:</label>
          <input
            type="password"
            id="auth-password"
            required
            placeholder="********"
          />

          <button
            type="submit"
            class="btn-primary"
            id="btn-auth-submit"
            style="width: 100%; margin-top: 1rem"
          >
            Entrar
          </button>
        </form>

        <p class="auth-switch">
          <span id="auth-switch-text">¿No tienes cuenta?</span>
          <a href="#" id="auth-switch-link">Regístrate aquí</a>
        </p>
      </article>
    </section>

    <!-- EL CONTENEDOR PRINCIPAL -->
    <div class="app-container hidden" id="app-container">
      <!-- 1. MENÚ LATERAL IZQUIERDO -->
      <aside class="sidebar">
        <header class="sidebar-logo">
          <h2>GetOrganized</h2>
        </header>

        <nav class="sidebar-section" aria-label="Espacios de Trabajo">
          <span class="section-title">ESPACIOS DE TRABAJO</span>

          <!-- Lista de proyectos -->
          <ul id="project-list" class="sidebar-nav">
            <!-- Se llena dinámicamente con JS -->
          </ul>

          <!-- NUEVO BOTÓN PARA AÑADIR CON ESTILO DASHED -->
          <button id="btn-add-project" class="btn-add-dashed">
            + Añadir Proyecto
          </button>
        </nav>
      </aside>

      <!-- 2. CONTENIDO PRINCIPAL DERECHO -->
      <div class="main-content">
        <header class="top-header">
          <!-- Botón hamburguesa (solo visible en móvil mediante CSS) -->
          <button
            id="btn-hamburger"
            class="btn-hamburger"
            aria-label="Abrir menú"
          >
            ☰
          </button>

          <div class="header-stats" id="stats-panel">
            <span class="stat-badge">Por Hacer: <b id="count-todo">0</b></span>
            <span class="stat-badge"
              >En Proceso: <b id="count-doing">0</b></span
            >
            <span class="stat-badge">Finalizado: <b id="count-done">0</b></span>
          </div>
          <div class="header-search">
            <input
              type="text"
              id="search-input"
              placeholder="Buscar tareas..."
            />
          </div>
        </header>

        <section class="toolbar" aria-label="Controles de vista">
          <div class="toolbar-tabs">
            <button class="tab active">Tablero Kanban</button>
            <button class="tab">Lista</button>
          </div>
          <button id="btn-create-task" class="btn-primary">
            + Nueva Tarea
          </button>
        </section>

        <!-- TABLERO KANBAN -->
        <main class="kanban-board">
          <section class="kanban-column" data-status="todo">
            <header class="column-header"><h2>Por Hacer</h2></header>
            <div class="task-list" id="todo-list"></div>
          </section>

          <section class="kanban-column" data-status="doing">
            <header class="column-header"><h2>En Proceso</h2></header>
            <div class="task-list" id="doing-list"></div>
          </section>

          <section class="kanban-column" data-status="done">
            <header class="column-header"><h2>Finalizado</h2></header>
            <div class="task-list" id="done-list"></div>
          </section>
        </main>

        <!-- VISTA DE LISTA -->
        <section id="list-board" class="list-board hidden">
          <!-- FILTROS DE PRIORIDAD -->
          <nav class="list-filters" aria-label="Filtros de prioridad">
            <button class="filter-btn active" data-priority="all">Todas</button>
            <button class="filter-btn" data-priority="Alta">
              <span class="dot red"></span> Alta
            </button>
            <button class="filter-btn" data-priority="Media">
              <span class="dot blue"></span> Media
            </button>
            <button class="filter-btn" data-priority="Baja">
              <span class="dot green"></span> Baja
            </button>
          </nav>

          <header class="list-header">
            <span>Tarea</span>
            <span>Prioridad</span>
            <span>Fecha Límite</span>
            <span>Estado</span>
            <span>Acciones</span>
          </header>

          <div class="list-content" id="list-content">
            <!-- Las tareas en formato fila se inyectarán aquí con JS -->
          </div>
        </section>
      </div>
    </div>

    <!-- MODAL PARA CREAR TAREA -->
    <dialog id="modal-create-task" class="modal">
      <form id="form-create-task">
        <h3>Crear Nueva Tarea</h3>
        <label for="task-title">Título:</label>
        <input type="text" id="task-title" required />
        <label for="task-desc">Descripción:</label>
        <textarea id="task-desc" required></textarea>
        <label for="task-priority">Prioridad:</label>
        <select id="task-priority">
          <option value="Alta">Alta</option>
          <option value="Media">Media</option>
          <option value="Baja">Baja</option>
        </select>
        <label for="task-date">Fecha límite:</label>
        <input type="date" id="task-date" />
        <div class="modal-actions">
          <button type="button" id="btn-cancel-task" class="btn-secondary">
            Cancelar
          </button>
          <button type="submit" class="btn-primary">Guardar</button>
        </div>
      </form>
    </dialog>

    <!-- MODAL ÚNICO: VISTA, EDICIÓN Y COMENTARIOS -->
    <dialog id="modal-task-view" class="modal">
      <header class="modal-header">
        <h3>Panel de Tarea</h3>
        <button type="button" id="btn-close-task-view" class="btn-close">
          ✖
        </button>
      </header>

      <section
        class="modal-body"
        style="
          display: flex;
          flex-direction: column;
          gap: 1rem;
          padding-top: 1rem;
        "
      >
        <!-- Formulario de Edición -->
        <form
          id="form-edit-task"
          style="display: flex; flex-direction: column; gap: 0.8rem"
        >
          <input type="hidden" id="edit-task-id" />

          <div>
            <label
              for="edit-task-title"
              style="font-size: 0.9rem; font-weight: bold"
              >Título:</label
            >
            <input
              type="text"
              id="edit-task-title"
              required
              style="width: 100%; padding: 0.5rem"
            />
          </div>

          <div>
            <label
              for="edit-task-desc"
              style="font-size: 0.9rem; font-weight: bold"
              >Descripción:</label
            >
            <textarea
              id="edit-task-desc"
              required
              style="width: 100%; padding: 0.5rem"
            ></textarea>
          </div>

          <div style="display: flex; gap: 1rem">
            <div style="flex: 1">
              <label
                for="edit-task-priority"
                style="font-size: 0.9rem; font-weight: bold"
                >Prioridad:</label
              >
              <select
                id="edit-task-priority"
                style="width: 100%; padding: 0.5rem"
              >
                <option value="Alta">Alta</option>
                <option value="Media">Media</option>
                <option value="Baja">Baja</option>
              </select>
            </div>
            <div style="flex: 1">
              <label
                for="edit-task-date"
                style="font-size: 0.9rem; font-weight: bold"
                >Fecha límite:</label
              >
              <input
                type="date"
                id="edit-task-date"
                style="width: 100%; padding: 0.5rem"
              />
            </div>
          </div>

          <div
            class="modal-actions"
            style="
              display: flex;
              justify-content: space-between;
              margin-top: 0.5rem;
            "
          >
            <button
              type="button"
              id="btn-delete-task"
              class="btn-secondary"
              style="color: #dc2626; border-color: #dc2626"
            >
              🗑️ Eliminar Tarea
            </button>
            <button type="submit" class="btn-primary">
              Actualizar Cambios
            </button>
          </div>
        </form>

        <hr
          style="border: none; border-top: 1px solid #e2e8f0; margin: 0.5rem 0"
        />

        <!-- Comentarios -->
        <section class="comments-section">
          <h4 style="margin-bottom: 0.8rem; color: #0f172a">
            💬 Comentarios del equipo
          </h4>
          <ul
            id="comments-list"
            class="comments-list"
            style="
              list-style: none;
              padding: 0;
              margin-bottom: 1rem;
              max-height: 150px;
              overflow-y: auto;
            "
          ></ul>

          <form id="form-add-comment" style="display: flex; gap: 0.5rem">
            <input
              type="text"
              id="new-comment-text"
              placeholder="Escribe un comentario..."
              required
              style="flex-grow: 1; padding: 0.5rem"
            />
            <button type="submit" class="btn-primary">Enviar</button>
          </form>
        </section>
      </section>
    </dialog>

    <script src="main.js"></script>
  </body>
</html>
