<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Kanban</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
</head>
<body>

    <div class="app-container">
        <!-- 1. MENÚ LATERAL IZQUIERDO (Limpio) -->
        <aside class="sidebar">
            <div class="sidebar-logo">
                <h2>FlowKanban</h2>
            </div>
            
            <div class="sidebar-section">
                <span class="section-title">ESPACIOS DE TRABAJO</span>
                <select id="project-select" class="project-dropdown">
                    <!-- Se llena con JS -->
                </select>
                <!-- Botón para abrir el administrador -->
                <button id="btn-manage-projects" class="btn-text">⚙️ Administrar Proyectos</button>
            </div>
        </aside>

        <!-- 2. CONTENIDO PRINCIPAL DERECHO -->
        <div class="main-content">
            <header class="top-header">
                <div class="header-stats" id="stats-panel">
                    <span class="stat-badge">Por Hacer: <b id="count-todo">0</b></span>
                    <span class="stat-badge">En Proceso: <b id="count-doing">0</b></span>
                    <span class="stat-badge">Finalizado: <b id="count-done">0</b></span>
                </div>
                <div class="header-search">
                    <input type="text" id="search-input" placeholder="Buscar tareas...">
                </div>
            </header>

            <div class="toolbar">
                <div class="toolbar-tabs">
                    <button class="tab active">Tablero Kanban</button>
                    <button class="tab">Lista</button>
                </div>
                <button id="btn-create-task" class="btn-primary">+ Nueva Tarea</button>
            </div>

            <!-- TABLERO KANBAN -->
            <main class="kanban-board">
                <section class="kanban-column" data-status="todo">
                    <div class="column-header"><h2>Por Hacer</h2></div>
                    <div class="task-list" id="todo-list"></div>
                </section>
                <section class="kanban-column" data-status="doing">
                    <div class="column-header"><h2>En Proceso</h2></div>
                    <div class="task-list" id="doing-list"></div>
                </section>
                <section class="kanban-column" data-status="done">
                    <div class="column-header"><h2>Finalizado</h2></div>
                    <div class="task-list" id="done-list"></div>
                </section>
            </main>

            <!-- NUEVA VISTA DE LISTA (Corregida con la clase hidden) -->
            <section id="list-board" class="list-board hidden">
                <div class="list-header">
                    <span>Tarea</span>
                    <span>Prioridad</span>
                    <span>Fecha Límite</span>
                    <span>Estado</span>
                    <span>Acciones</span>
                </div>
                <div class="list-content" id="list-content">
                    <!-- Las tareas en formato fila se inyectarán aquí con JS -->
                </div>
            </section>

        </div>
    </div>

    <!-- MODAL ADMINISTRAR PROYECTOS -->
    <dialog id="modal-manage-projects" class="modal">
        <div class="modal-header">
            <h3>Administrar Espacios</h3>
            <button type="button" id="btn-close-manage-projects" class="btn-close">✖</button>
        </div>
        
        <div class="manage-projects-container">
            <!-- Formulario para añadir nuevo -->
            <form id="form-add-project" class="add-project-form">
                <input type="text" id="new-project-name" required placeholder="Nombre del nuevo proyecto...">
                <button type="submit" class="btn-primary">Añadir</button>
            </form>

            <!-- Lista de proyectos existentes -->
            <ul id="manage-projects-list" class="projects-list">
                <!-- Se llena con JS -->
            </ul>
        </div>
    </dialog>

    <!-- MODAL PARA CREAR TAREA -->
    <dialog id="modal-create-task" class="modal">
        <form id="form-create-task">
            <h3>Crear Nueva Tarea</h3>
            <label for="task-title">Título:</label>
            <input type="text" id="task-title" required>
            <label for="task-desc">Descripción:</label>
            <textarea id="task-desc" required></textarea>
            <label for="task-priority">Prioridad:</label>
            <select id="task-priority">
                <option value="Alta">Alta</option>
                <option value="Media">Media</option>
                <option value="Baja">Baja</option>
            </select>
            <label for="task-date">Fecha límite:</label>
            <input type="date" id="task-date">
            <div class="modal-actions">
                <button type="button" id="btn-cancel-task" class="btn-secondary">Cancelar</button>
                <button type="submit" class="btn-primary">Guardar</button>
            </div>
        </form>
    </dialog>

    <!-- MODAL PARA EDITAR TAREA -->
    <dialog id="modal-edit-task" class="modal">
        <form id="form-edit-task">
            <h3>Editar Tarea</h3>
            <input type="hidden" id="edit-task-id">
            <label for="edit-task-title">Título:</label>
            <input type="text" id="edit-task-title" required>
            <label for="edit-task-desc">Descripción:</label>
            <textarea id="edit-task-desc" required></textarea>
            <label for="edit-task-priority">Prioridad:</label>
            <select id="edit-task-priority">
                <option value="Alta">Alta</option>
                <option value="Media">Media</option>
                <option value="Baja">Baja</option>
            </select>
            <label for="edit-task-date">Fecha límite:</label>
            <input type="date" id="edit-task-date">
            <div class="modal-actions">
                <button type="button" id="btn-cancel-edit" class="btn-secondary">Cancelar</button>
                <button type="submit" class="btn-primary">Actualizar</button>
            </div>
        </form>
    </dialog>

    <script src="main.js"></script>
</body>
</html>
